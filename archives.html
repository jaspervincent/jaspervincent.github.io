<div class="archive">
  <div class="archive-controls">
    <input type="search" id="archive-q" class="form-control archive-search"
           placeholder="搜索标题…" autocomplete="off" aria-label="搜索文章">
    <div class="archive-summary">
      <span id="archive-count">加载中…</span>
      <button type="button" id="archive-clear" class="archive-clear" hidden>清除筛选</button>
    </div>
  </div>

  <div class="archive-facet">
    <div id="archive-tags" class="archive-chips"></div>
  </div>

  <ul id="archive-list" class="archive-list"></ul>
  <p id="archive-empty" class="archive-empty" hidden>没有匹配的文章。</p>
</div>

<script>
(function () {
  var UNTAGGED = 'Untagged';   // 与 build-site.el 的 my/untagged-label 保持一致
  var idx = [];
  var selTag = null;
  var qEl     = document.getElementById('archive-q');
  var listEl  = document.getElementById('archive-list');
  var countEl = document.getElementById('archive-count');
  var emptyEl = document.getElementById('archive-empty');
  var clearEl = document.getElementById('archive-clear');
  var tagsEl  = document.getElementById('archive-tags');

  function tally() {
    var m = Object.create(null);
    idx.forEach(function (it) {
      (it.g || []).forEach(function (v) { m[v] = (m[v] || 0) + 1; });
    });
    return Object.keys(m)
      .map(function (k) { return { name: k, n: m[k] }; })
      .sort(function (a, b) {
        // Untagged 固定排最后，不参与按数量排序 —— 它不是一个真主题
        if (a.name === UNTAGGED) return 1;
        if (b.name === UNTAGGED) return -1;
        return b.n - a.n || a.name.localeCompare(b.name);
      });
  }

  function renderTags(items) {
    tagsEl.textContent = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'archive-chip';
      b.dataset.name = it.name;
      b.textContent = it.name;
      var c = document.createElement('span');
      c.className = 'archive-chip-n';
      c.textContent = it.n;
      b.appendChild(c);
      tagsEl.appendChild(b);
    });
  }

  // 只搜标题。
  //
  // 曾经把描述也纳入搜索，结果是搜 "linux" 会命中 "Safe: 07-风险评估"
  // 这类正文里顺带提过 Linux 的文章 —— 噪音太大。标题才是可预期的信号。
  // 分类筛选交给标签，不靠搜索。
  function matches(it, q) {
    if (selTag && (it.g || []).indexOf(selTag) === -1) return false;
    if (!q) return true;
    var title = it.t.toLowerCase();
    // 按空格拆词、每个词都要在标题里出现，这样 "linux pandoc" 也能命中
    // "Linux: Pandoc文件转换器"，不受词序和中间字符影响
    return q.split(/\s+/).every(function (w) { return title.indexOf(w) !== -1; });
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    // 索引本身已按日期倒序，不再额外排序
    var hits = idx.filter(function (it) { return matches(it, q); });

    listEl.textContent = '';
    hits.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'archive-item';

      var t = document.createElement('time');
      t.className = 'archive-date';
      t.textContent = it.d || '';
      li.appendChild(t);

      var a = document.createElement('a');
      a.href = '/' + it.u;
      a.textContent = it.t;
      li.appendChild(a);

      (it.g || []).forEach(function (g) {
        var s = document.createElement('span');
        s.className = 'archive-badge';
        s.textContent = g;
        li.appendChild(s);
      });
      listEl.appendChild(li);
    });

    countEl.textContent = hits.length + ' / ' + idx.length + ' 篇';
    emptyEl.hidden = hits.length !== 0;
    clearEl.hidden = !(q || selTag);

    document.querySelectorAll('.archive-chip').forEach(function (b) {
      b.classList.toggle('is-on', b.dataset.name === selTag);
    });
  }

  tagsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.archive-chip');
    if (!b) return;
    // 再点一次同一个标签即取消筛选
    selTag = (selTag === b.dataset.name) ? null : b.dataset.name;
    render();
  });

  qEl.addEventListener('input', render);
  clearEl.addEventListener('click', function () {
    qEl.value = ''; selTag = null; render();
  });

  fetch('/search-index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      idx = data;
      renderTags(tally());
      render();
    })
    .catch(function (err) {
      countEl.textContent = '索引加载失败：' + err.message;
      console.error('search-index.json 加载失败', err);
    });
})();
</script>
