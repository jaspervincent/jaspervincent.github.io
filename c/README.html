Linus 怎么看 C++
</p>

<ul class="org-ul">

<li><p>
容易犯错：使用 C++ 库(例如 STL 和 Boost)可能会带来问题。
</p>

<p>
这些库可能不稳定、不兼容，而且使时可能会出错。
</p></li>

<li>性能：C++ 的一些特性可能会引入额外的性能开销，尤其是在系统级编程中，性能通常是至关重要的。 Linus 可能更喜欢使用纯 C 来确保最大的性能优化。</li>
</ul>
