/* main.css 默认把 body 隐藏起来，为的是切换深色模式时不闪白。
   恢复可见完全交给 CSS 的 html.js:not(.ready) 选择器控制：
   - 没有 JS：下面这句不会执行，html 上没有 .js，body 一开始就是可见的
   - 有 JS 但 main.js 加载失败或抛异常：load 事件（或 2 秒兜底）照样会加上 .ready
   任何一条路径都不会留下白屏。 */
(function () {
  var el = document.documentElement;
  el.className += ' js';
  function reveal() { el.className += ' ready'; }
  window.addEventListener('load', reveal);
  setTimeout(reveal, 2000);
})();
</script>
