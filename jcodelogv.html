function initSearchInput() {
    $('input#post-search').on('input', function(event) {
        var keyword = $('input#post-search').val();
        if (keyword.length == 0) {
            $.when(
                $('ul.org-ul li').each(function(index, el) {
                    $(el).show(300);
                })
            )
        } else {
            $.when(
                $('ul.org-ul li').each(function(index, el) {
                    var postTitle = $(el).find('a').text().toLowerCase();
                    // console.log(postTitle);
                    if (postTitle.indexOf(keyword.toLowerCase()) == -1){
                        $(el).hide(300);
                    } else {
                        $(el).show(300)
                    }
                })
            )
        }
    });
}
$(document).ready(function() {
    initSearchInput();
})
</script>
