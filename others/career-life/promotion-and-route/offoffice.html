<div class="outline-text-2" id="text-org24c7250">
<p>
高级的，可以用iptables  coova chilli  + ip隧道，把公司打造成一个开源框架的网络<br>
</p>

<p>
就是把员工上网变成pptp方式，然后很多楼层路由器变成linux，ip隧道<br>
</p>

<p>
大概就是每层有2个linux做路由器，通过pptp拨号上网，linux路由器限制网速<br>
同时用隧道与idc机房打通内网<br>
</p>


<p>
其实还好，主要是路由表 和 ip隧道方向要搞清楚，比较折腾<br>
</p>

<p>
或者简单的，openvpn ，你也可以改造的<br>
freeradius  openvpn + iptables脚本就能改造<br>
而且还能给vpn一个可视化平台<br>
</p>
