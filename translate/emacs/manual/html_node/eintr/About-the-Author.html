<h2 class="unnumbered" id="g_t_5173_4e8e_4f5c_8005"><span>关于作者<a class="copiable-link" href="#g_t_5173_4e8e_4f5c_8005"> &para;</a></span></h2>

<blockquote class="quotation">
<p>Robert J. Chassell （1946–2017）于1985年开始使用 GNU Emacs。他撰写、编辑并讲授 Emacs 与 Emacs Lisp，在全球各地宣讲软件自由理念。查塞尔是自由软件基金会的创始理事兼财务主管，也是《<cite class="cite">Texinfo</cite>》手册的合著者，还编辑过十余部其他著作。他毕业于英国剑桥大学，长期关注社会与经济史，并持有私人飞机驾驶执照。
</p>
<p><a class="uref" href="https://www.fsf.org/blogs/community/goodbye-to-bob-chassell">&quot;Goodbye to Bob Chassell&quot;</a>
</p></blockquote>
