<h4 class="unnumberedsubsec" id="g_t_5c55_793a_6570_636e_7684_8be6_7ec6_5904_7406"><span>展示数据的详细处理<a class="copiable-link" href="#g_t_5c55_793a_6570_636e_7684_8be6_7ec6_5904_7406"> &para;</a></span></h4>

<p>基于之前的工作，我们可以很容易预见：编写一个函数，沿着长度列表依次取 <small class="sc">CDR</small>，查看每个元素，判断其所属长度区间，并对对应区间的计数器递增，这并不困难。
</p>
<p>不过，在编写该函数之前，我们应当考虑先对长度列表排序的好处，让数字从小到大有序排列。首先，排序会让每个区间的数字统计更简单，因为相邻数字要么在同一区间，要么在相邻区间。其次，通过查看排序后的列表，我们可以找到最大值与最小值，从而确定需要使用的最大与最小长度区间。
</p>
