<h3 class="section" id="g_t_6c42_503c"><span>1.6 求值<a class="copiable-link" href="#g_t_6c42_503c"> &para;</a></span></h3>
<a class="index-entry-id" id="index-Evaluation"></a>

<p>Lisp 解释器对表达式进行处理的这一行为，被称为 <em class="dfn">求值(evaluation)</em>。
我们会说解释器 &ldquo;对表达式求值&rdquo;。这个词我之前已经用过多次。
根据《韦氏新大学词典》的释义，该词源自日常用语，意为 &ldquo;确定价值或数量；评估&rdquo;。
</p>
