<h4 class="subsection" id="g_t_5e26_9012_589e_8ba1_6570_5668_7684_5faa_73af"><span>11.1.3 带递增计数器的循环<a class="copiable-link" href="#g_t_5e26_9012_589e_8ba1_6570_5668_7684_5faa_73af"> &para;</a></span></h4>

<p>循环必须在合适的时候停止才有意义。除了用列表控制循环外，另一种常用的停止方式是将第一个参数写为一个判断条件，在完成指定次数重复后返回假。这意味着循环必须包含一个计数器——用于记录循环执行次数的表达式。
</p>
