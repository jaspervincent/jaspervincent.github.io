<h3 class="section" id="Lisp-_5217_8868"><span>1.1 Lisp 列表<a class="copiable-link" href="#Lisp-_5217_8868"> &para;</a></span></h3>
<a class="index-entry-id" id="index-Lisp-Lists"></a>

<p>在 Lisp 中，列表的形式如下：<code class="code">'(rose violet daisy buttercup)</code>。
该列表以一个单引号开头。它也可以写成下面这种更符合你日常认知的形式：
</p>
<div class="example smallexample">
<div class="group"><pre class="example-preformatted">'(rose
  violet
  daisy
  buttercup)
</pre></div></div>

<p>这个列表的元素是四种不同花卉的名称，它们由空白符分隔，并用括号包裹，
就像田野里的花朵被一圈石墙环绕。
<a class="index-entry-id" id="index-Flowers-in-a-field"></a>
</p>
