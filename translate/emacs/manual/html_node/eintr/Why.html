<h3 class="unnumberedsec" id="g_t_4e3a_4f55_5b66_4e60-Emacs-Lisp_ff1f"><span>为何学习 Emacs Lisp？<a class="copiable-link" href="#g_t_4e3a_4f55_5b66_4e60-Emacs-Lisp_ff1f"> &para;</a></span></h3>

<p>尽管 Emacs Lisp 通常只被认为与 Emacs 相关，但它实际上是一门完整的计算机编程语言。你可以像使用其他任何编程语言一样使用 Emacs Lisp。
</p>
<p>也许你想理解编程，也许你想扩展 Emacs 功能，又或者你希望成为一名程序员。这份 Emacs Lisp 入门指南旨在帮你起步：引导你学习编程基础，更重要的是，向你展示如何自主学习更深入的内容。
</p>
