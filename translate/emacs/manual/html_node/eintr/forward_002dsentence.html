<h3 class="section" id="forward_002dsentence-1"><span>12.3 <code class="code">forward-sentence</code><a class="copiable-link" href="#forward_002dsentence-1"> &para;</a></span></h3>
<a class="index-entry-id" id="index-forward_002dsentence"></a>

<p>将光标向前移动一个句子的命令，是在 Emacs Lisp 中使用正则表达式搜索的典型示例。实际上该函数看起来比实际更长更复杂，因为它同时支持向前与向后移动，并且可以可选地跳过多个句子。该函数通常绑定到按键 <kbd class="kbd">M-e</kbd>。
