<h4 class="unnumberedsubsec" id="print_002dY_002daxis-_51fd_6570_8be6_89e3"><span><code class="code">print-Y-axis</code> 函数详解<a class="copiable-link" href="#print_002dY_002daxis-_51fd_6570_8be6_89e3"> &para;</a></span></h4>

<p>从示例图中可以很直观地看到纵轴标注的样式，但要用文字描述并写出实现函数则是另一回事。简单说每五行打印一个数字和刻度并不准确：数字 &lsquo;<samp class="samp">1</samp>&rsquo; 和 &lsquo;<samp class="samp">5</samp>&rsquo; 之间只有三行（第 2、3、4 行），而 &lsquo;<samp class="samp">5</samp>&rsquo; 和 &lsquo;<samp class="samp">10</samp>&rsquo; 之间却有四行（第 6、7、8、9 行）。更准确的说法是：我们要在基线（数字 1）打印数字和刻度，然后在从底部数第五行，以及所有 5 的倍数行打印数字和刻度。
</p>
