<p><code class="code">save-excursion</code> 是本章要讲解的最后一个特殊形式。
</p>
<p>在用于编辑的 Emacs Lisp 程序中，<code class="code">save-excursion</code> 非常常用。
它会保存光标位置，执行函数体，然后在位置发生改变时将光标恢复到原先位置。
它的主要作用是避免用户因光标意外移动而感到困惑和不适。
</p>
