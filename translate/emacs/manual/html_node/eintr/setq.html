<a class="index-entry-id" id="index-bind-defined"></a>
<p>为变量赋值有多种方式，其中一种是使用特殊形式 <code class="code">setq</code>，另一种是使用 <code class="code">let</code>（see <a class="pxref" href="let.html"><code class="code">let</code></a>）。该过程的专业术语是将变量<em class="dfn">绑定(bind)</em>到一个值。
</p>
