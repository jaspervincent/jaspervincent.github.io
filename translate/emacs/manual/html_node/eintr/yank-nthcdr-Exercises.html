<h3 class="section" id="yank-_4e0e-nthcdr-_7ec3_4e60"><span>10.3 <code class="code">yank</code> 与 <code class="code">nthcdr</code> 练习<a class="copiable-link" href="#yank-_4e0e-nthcdr-_7ec3_4e60"> &para;</a></span></h3>

<ul class="itemize mark-bullet">
<li>使用 <kbd class="kbd">C-h v</kbd>（<code class="code">describe-variable</code>）查看删除环的值。
向删除环添加若干项，再次查看其值。
使用 <kbd class="kbd">M-y</kbd>（<code class="code">yank-pop</code>）遍历整个删除环。
你的删除环中有多少项？查找 <code class="code">kill-ring-max</code> 的值。
你的删除环是否已满，还是仍可存放更多文本块？

</li><li>使用 <code class="code">nthcdr</code> 和 <code class="code">car</code> 构造一系列表达式，
分别返回列表的第一个、第二个、第三个和第四个元素。
</li></ul>
