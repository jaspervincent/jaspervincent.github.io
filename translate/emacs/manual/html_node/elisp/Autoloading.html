<h4 class="subsection" id="g_t_81ea_52a8_52a0_8f7d"><span>10.2.8 自动加载<a class="copiable-link" href="#g_t_81ea_52a8_52a0_8f7d"> &para;</a></span></h4>

<p><em class="dfn">自动加载（autoload）</em> 特性允许你调用一个尚未加载到 Emacs 中的函数或宏。它会指定包含该定义的文件。当一个自动加载对象作为某个符号的函数定义出现时，以函数形式调用该符号会自动加载指定的文件，然后调用从该文件中加载出来的真实定义。如何设置让自动加载对象成为符号的函数定义，详见 <a class="ref" href="Autoload.html">自动加载</a>。
</p>
