<h2 class="chapter" id="g_t_5907_4efd_4e0e_81ea_52a8_4fdd_5b58"><span>27 备份与自动保存<a class="copiable-link" href="#g_t_5907_4efd_4e0e_81ea_52a8_4fdd_5b58"> &para;</a></span></h2>
<a class="index-entry-id" id="index-backups-and-auto_002dsaving"></a>

<p>备份文件与自动保存文件是 Emacs 用于保护用户免受系统崩溃或自身操作失误影响的两种机制。
自动保存会保留当前编辑会话中较早的文本内容；备份文件则保存当前会话开始之前的文件内容。
</p>
