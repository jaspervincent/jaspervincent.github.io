<h3 class="section" id="g_t_5411_540e_517c_5bb9"><span>7.2 向后兼容<a class="copiable-link" href="#g_t_5411_540e_517c_5bb9"> &para;</a></span></h3>

<p>使用旧版 <code class="code">cl-defstruct</code> 编译、且未使用记录（record）的代码，在新版 Emacs 中运行时可能会出现问题。为缓解这一情况，Emacs 会检测是否使用了旧版 <code class="code">cl-defstruct</code>，并启用一种兼容模式：在该模式下，<code class="code">type-of</code> 会把旧版结构体对象当作记录来处理。
</p>
<dl class="first-deffn first-defun-alias-first-deffn def-block">
<dt class="deffn defun-alias-deffn def-line" id="index-cl_002dold_002dstruct_002dcompat_002dmode"><span class="category-def">Function: </span><span><strong class="def-name">cl-old-struct-compat-mode</strong> <var class="def-var-arguments">arg</var><a class="copiable-link" href="#index-cl_002dold_002dstruct_002dcompat_002dmode"> &para;</a></span></dt>
<dd><p>如果 <var class="var">arg</var> 为正数，则启用对旧版结构体的向后兼容。
</p></dd></dl>
