<h3 class="section" id="g_t_7f13_51b2_533a_5c40_90e8_53d8_91cf"><span>12.11 缓冲区局部变量<a class="copiable-link" href="#g_t_7f13_51b2_533a_5c40_90e8_53d8_91cf"> &para;</a></span></h3>
<a class="index-entry-id" id="index-variable_002c-buffer_002dlocal"></a>
<a class="index-entry-id" id="index-buffer_002dlocal-variables"></a>

<p>全局变量和局部变量绑定在大多数编程语言中都以各种形式存在。而 Emacs 还额外支持一些特殊的变量绑定方式，例如 <em class="dfn">缓冲区局部（buffer‑local）</em> 绑定，它只在单个缓冲区中生效。
让同一个变量在不同缓冲区中拥有不同的值，是一种重要的定制手段。（变量也可以拥有对每个终端都局部的绑定。See <a class="xref" href="Multiple-Terminals.html">多终端</a>。）
</p>
