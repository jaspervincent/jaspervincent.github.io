<h3 class="section" id="C-_8bed_8a00_65b9_8a00"><span>E.6 C 语言方言<a class="copiable-link" href="#C-_8bed_8a00_65b9_8a00"> &para;</a></span></h3>
<a class="index-entry-id" id="index-C-programming-language"></a>

<p>Emacs 的 C 代码可移植至 C99 及更高版本：在未做检查（通常在配置阶段）的情况下，不会使用 &lsquo;<samp class="samp">&lt;stdckdint.h&gt;</samp>&rsquo;、&lsquo;<samp class="samp">[[noreturn]]</samp>&rsquo; 等新版 C 特性，必要时 Emacs 构建流程会提供替代实现。部分新版特性（如匿名结构体和联合体）难以模拟，因此会完全避免使用。
</p>
<p>未来某个时间点，基础 C 方言无疑会升级到比 C99 更新的版本。
</p>
