<h4 class="subsection" id="g_t_5217_8868_5f62_5f0f_7684_5206_7c7b"><span>10.2.3 列表形式的分类<a class="copiable-link" href="#g_t_5217_8868_5f62_5f0f_7684_5206_7c7b"> &para;</a></span></h4>
<a class="index-entry-id" id="index-list-form-evaluation"></a>
<a class="index-entry-id" id="index-forms_002c-list"></a>

<p>非空列表形式根据其第一个元素，可以是函数调用、宏调用或特殊形式。这三类形式的求值方式各不相同，下文会分别说明。列表中其余的元素构成该函数、宏或特殊形式的 <em class="dfn">实参（arguments）</em>。
</p>
<p>对非空列表进行求值的第一步，是检查它的第一个元素。仅由这个元素就能决定该列表属于哪类形式，以及列表的其余部分该如何处理。第一个元素 <em class="emph">不会</em> 被求值，这一点与 Scheme 等其他一些 Lisp 方言不同。
</p>
