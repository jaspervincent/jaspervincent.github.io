<h4 class="subsection" id="g_t_6761_4ef6_53d8_91cf_7c7b_578b"><span>2.5.11 条件变量类型<a class="copiable-link" href="#g_t_6761_4ef6_53d8_91cf_7c7b_578b"> &para;</a></span></h4>

<p><em class="dfn">条件变量(condition variable)</em> 是一种用于比互斥锁更复杂的线程同步机制。一个线程可以在某个条件变量上等待，直到其他线程对该条件发出通知后才被唤醒。
</p>
<p>条件变量对象没有可读语法。它们以井号尖括号形式打印，显示条件变量名称（如果已命名）或其内存地址：
</p>
<div class="example">
<div class="group"><pre class="example-preformatted">(make-condition-variable (make-mutex))
    &rArr; #&lt;condvar 01c45ae8&gt;
</pre></div></div>

</div>
