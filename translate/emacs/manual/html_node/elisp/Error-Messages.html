<h4 class="subsection" id="g_t_9519_8bef_4fe1_606f"><span>1.3.5 错误信息<a class="copiable-link" href="#g_t_9519_8bef_4fe1_606f"> &para;</a></span></h4>
<a class="index-entry-id" id="index-error-message-notation"></a>

<p>部分示例会触发错误。这种情况下，通常会在回显区显示一条错误信息。我们在以 &lsquo;<samp class="samp">error&rarr;</samp>&rsquo; 开头的一行中展示错误信息。注意：&lsquo;<samp class="samp">error&rarr;</samp>&rsquo; 本身并不会出现在回显区中。
</p>
<div class="example">
<pre class="example-preformatted">(+ 23 'x)
error&rarr; Wrong type argument: number-or-marker-p, x
error&rarr; 参数类型错误：应为数值或标记类型，实际为 x
</pre></div>

</div>
