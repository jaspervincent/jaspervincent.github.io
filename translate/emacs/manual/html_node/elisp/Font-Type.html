<h4 class="subsection" id="g_t_5b57_4f53_7c7b_578b"><span>2.5.15 字体类型<a class="copiable-link" href="#g_t_5b57_4f53_7c7b_578b"> &para;</a></span></h4>

<p><em class="dfn">font字体</em> 用于指定在图形终端上如何显示文本。实际上存在三种独立的字体类型：<em class="dfn">font objects字体对象</em>、<em class="dfn">font specs字体规格</em>和 <em class="dfn">font entities字体实体</em>，每种类型的属性略有不同。它们都没有可读语法，打印形式分别为：&lsquo;<samp class="samp">#&lt;font-object&gt;</samp>&rsquo;、&lsquo;<samp class="samp">#&lt;font-spec&gt;</samp>&rsquo; 和 &lsquo;<samp class="samp">#&lt;font-entity&gt;</samp>&rsquo;。
有关这些 Lisp 对象的说明，see <a class="pxref" href="Low_002dLevel-Font.html">底层字体表示</a>。
</p>
