<h3 class="section" id="g_t_6587_4ef6_683c_5f0f_8f6c_6362"><span>26.13 文件格式转换<a class="copiable-link" href="#g_t_6587_4ef6_683c_5f0f_8f6c_6362"> &para;</a></span></h3>

<a class="index-entry-id" id="index-file-format-conversion"></a>
<a class="index-entry-id" id="index-encoding-file-formats"></a>
<a class="index-entry-id" id="index-decoding-file-formats"></a>
<a class="index-entry-id" id="index-text-properties-in-files"></a>
<a class="index-entry-id" id="index-saving-text-properties"></a>
<p>Emacs 会执行多个步骤，在缓冲区中的数据（文本、文本属性，以及可能的其他信息）与适合存入文件的表示形式之间互相转换。本节介绍执行这种 <em class="dfn">格式转换(format conversion)</em>的基础函数，即用于将文件读入缓冲区的 <code class="code">insert-file-contents</code>，以及用于将缓冲区写入文件的 <code class="code">write-region</code>。
</p>
