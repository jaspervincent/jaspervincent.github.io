<h4 class="subsection" id="g_t_63cf_8ff0_683c_5f0f"><span>1.3.7 描述格式<a class="copiable-link" href="#g_t_63cf_8ff0_683c_5f0f"> &para;</a></span></h4>
<a class="index-entry-id" id="index-description-format"></a>

<p>本手册对函数、变量、宏、命令、用户选项和特殊forms 采用统一格式进行描述。描述的第一行会包含该对象的名称，其后附带其参数（如果有）。
对象的类别 &mdash; 函数、变量或其他类型 &mdash; 会出现在该行开头。
后续行是具体说明，有时会附带示例。
</p>
