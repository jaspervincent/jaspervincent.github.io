<h4 class="subsection" id="g_t_6846_67b6_914d_7f6e_7c7b_578b"><span>2.5.7 框架配置类型<a class="copiable-link" href="#g_t_6846_67b6_914d_7f6e_7c7b_578b"> &para;</a></span></h4>
<a class="index-entry-id" id="index-screen-layout"></a>
<a class="index-entry-id" id="index-window-layout_002c-all-frames"></a>

<p><em class="dfn">框架配置(frame configuration)</em> 用于保存所有框架中窗口的位置、大小和内容等信息。它不是基本类型，实际上是一个列表：其 <small class="sc">CAR</small> 为 <code class="code">frame-configuration</code>，<small class="sc">CDR</small> 为一个关联列表（alist）。关联列表中的每个元素描述一个框架，该框架作为元素的 <small class="sc">CAR</small> 存在。
</p>
<p>有关框架配置的相关函数说明，see <a class="pxref" href="Frame-Configurations.html">框架配置</a>。
</p>
