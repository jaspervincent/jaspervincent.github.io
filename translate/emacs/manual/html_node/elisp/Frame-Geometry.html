<h3 class="section" id="g_t_6846_67b6_51e0_4f55_5c5e_6027"><span>30.3 框架几何属性<a class="copiable-link" href="#g_t_6846_67b6_51e0_4f55_5c5e_6027"> &para;</a></span></h3>
<a class="index-entry-id" id="index-frame-geometry"></a>
<a class="index-entry-id" id="index-frame-position"></a>
<a class="index-entry-id" id="index-position-of-frame"></a>
<a class="index-entry-id" id="index-frame-size"></a>
<a class="index-entry-id" id="index-size-of-frame"></a>

<p>框架的几何属性取决于构建当前 Emacs 实例所使用的工具包以及显示该框架的终端。
本章描述这些依赖关系以及处理它们的部分函数。
注意，所有这些函数的 <var class="var">frame</var> 参数都必须指定一个可用框架
（see <a class="pxref" href="Deleting-Frames.html">删除框架</a>）。如果省略或为 <code class="code">nil</code>，则表示当前选中框架
（see <a class="pxref" href="Input-Focus.html">输入焦点</a>）。
</p>
