<h4 class="subsection" id="g_t_6846_67b6_7c7b_578b"><span>2.5.4 框架类型<a class="copiable-link" href="#g_t_6846_67b6_7c7b_578b"> &para;</a></span></h4>

<p><em class="dfn">fram框架</em> 是一块包含一个或多个 Emacs 窗口的屏幕区域；我们也用 &ldquo;frame(框架)&rdquo; 一词表示 Emacs 用来指代这块屏幕区域的 Lisp 对象。
</p>
<p>框架没有可读语法。打印时会以井号尖括号形式显示框架标题及其内存地址（用于唯一标识该框架）。
</p>
<div class="example">
<div class="group"><pre class="example-preformatted">(selected-frame)
     &rArr; #&lt;frame emacs@psilocin.gnu.org 0xdac80&gt;
</pre></div></div>

<p>有关操作框架的函数说明，see <a class="pxref" href="Frames.html">框架</a>。
</p>
</div>
