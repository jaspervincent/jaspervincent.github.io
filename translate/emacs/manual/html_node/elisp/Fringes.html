<h3 class="section" id="g_t_4fa7_8fb9_680f"><span>42.13 侧边栏<a class="copiable-link" href="#g_t_4fa7_8fb9_680f"> &para;</a></span></h3>
<a class="index-entry-id" id="index-fringes"></a>

<p>在图形化显示器上，Emacs 会在每个窗口旁绘制 <em class="dfn">侧边栏(fringes)</em>：
窗口两侧的细长垂直区域，可显示位图以指示截断、续行、水平滚动等状态。
</p>
