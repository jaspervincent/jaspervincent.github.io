<h3 class="section" id="GnuTLS-_52a0_5bc6"><span>33.28 GnuTLS 加密<a class="copiable-link" href="#GnuTLS-_52a0_5bc6"> &para;</a></span></h3>
<a class="index-entry-id" id="index-MD5-checksum-1"></a>

<a class="index-entry-id" id="index-cipher_002c-symmetric"></a>

<p>如果在编译时启用 GnuTLS，Emacs 将提供内置的加密支持。
沿用 GnuTLS API 术语，可用工具包括摘要算法、MAC 算法、对称密码和 AEAD 密码。
</p>
<p>本文所用术语（如 IV，即初始化向量）需要具备一定的密码学基础，此处不做详细定义。
如需了解 GnuTLS 库的术语与结构，可查阅 <a class="uref" href="https://www.gnutls.org/">https://www.gnutls.org/</a> 上的专门文档。
</p>
