<h3 class="section" id="g_t_6587_4ef6_4fe1_606f"><span>26.6 文件信息<a class="copiable-link" href="#g_t_6587_4ef6_4fe1_606f"> &para;</a></span></h3>
<a class="index-entry-id" id="index-file_002c-information-about"></a>

<p>本节介绍用于获取文件（或目录、符号链接）各类信息的函数，例如文件是否可读、可写，以及文件大小等。这些函数均以文件名作为参数。除特别注明外，这些参数必须指向已存在的文件，否则会抛出错误。
</p>
<a class="index-entry-id" id="index-file-names_002c-trailing-whitespace"></a>
<a class="index-entry-id" id="index-trailing-blanks-in-file-names"></a>
<p>使用以空格结尾的文件名时需格外小心。在部分文件系统（尤其是 MS-Windows）上，文件名末尾的空白字符会被静默自动忽略。
</p>
