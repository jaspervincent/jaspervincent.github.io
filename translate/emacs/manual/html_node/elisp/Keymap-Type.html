<h4 class="subsection" id="g_t_6309_952e_6620_5c04_7c7b_578b"><span>2.5.13 按键映射类型<a class="copiable-link" href="#g_t_6309_952e_6620_5c04_7c7b_578b"> &para;</a></span></h4>

<p><em class="dfn">keymap按键映射</em> 将用户输入的按键映射到对应的命令。这种映射控制着用户命令输入的执行方式。按键映射实际上是一个列表，其 <small class="sc">CAR</small> 为符号 <code class="code">keymap</code>。
</p>
<p>有关创建按键映射、处理前缀键、局部与全局按键映射，以及修改按键绑定的信息，see <a class="pxref" href="Keymaps.html">按键映射</a>。
</p>
