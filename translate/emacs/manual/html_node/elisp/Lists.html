<h2 class="chapter" id="g_t_5217_8868"><span>5 列表<a class="copiable-link" href="#g_t_5217_8868"> &para;</a></span></h2>
<a class="index-entry-id" id="index-lists"></a>
<a class="index-entry-id" id="index-element-_0028of-list_0029"></a>

<p><em class="dfn">list列表</em> 表示由零个或多个元素组成的序列（元素可以是任意 Lisp 对象）。列表与向量的重要区别在于：两个或多个列表可以共享部分结构；此外，你可以在列表中插入或删除元素，而无需复制整个列表。
</p>
