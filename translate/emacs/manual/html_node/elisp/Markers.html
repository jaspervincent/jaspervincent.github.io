<h2 class="chapter" id="g_t_6807_8bb0"><span>32 标记<a class="copiable-link" href="#g_t_6807_8bb0"> &para;</a></span></h2>
<a class="index-entry-id" id="index-markers"></a>

<p><em class="dfn">标记(marker)</em>是一种 Lisp 对象，用于相对于周围文本指定缓冲区中的位置。每当插入或删除文本时，标记会自动改变其与缓冲区开头的偏移量，从而始终停留在它两侧的两个字符之间。
</p>
