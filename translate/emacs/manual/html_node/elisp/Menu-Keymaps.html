<h3 class="section" id="g_t_83dc_5355_6309_952e_6620_5c04"><span>23.18 菜单按键映射<a class="copiable-link" href="#g_t_83dc_5355_6309_952e_6620_5c04"> &para;</a></span></h3>
<a class="index-entry-id" id="index-menu-keymaps"></a>

<p>按键映射既可以作为菜单使用，也可以为键盘按键和鼠标按钮定义绑定。
菜单通常通过鼠标触发，但也可以通过键盘操作。
如果菜单按键映射对下一个输入事件处于活跃状态，就会激活键盘菜单功能。
</p>
