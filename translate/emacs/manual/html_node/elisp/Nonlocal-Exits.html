<h3 class="section" id="g_t_975e_5c40_90e8_9000_51fa"><span>11.7 非局部退出<a class="copiable-link" href="#g_t_975e_5c40_90e8_9000_51fa"> &para;</a></span></h3>
<a class="index-entry-id" id="index-nonlocal-exits"></a>

<p><em class="dfn">非局部退出（nonlocal exit）</em> 是指将程序的控制流从一个位置直接转移到另一个较远的位置。在 Emacs Lisp 中，非局部退出可能因错误而触发，你也可以显式地使用它们。非局部退出会解除被退出结构所建立的所有变量绑定。
</p>
