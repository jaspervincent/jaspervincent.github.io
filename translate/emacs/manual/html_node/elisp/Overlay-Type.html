<h4 class="subsection" id="g_t_8986_76d6_5c42_7c7b_578b"><span>2.5.14 覆盖层类型<a class="copiable-link" href="#g_t_8986_76d6_5c42_7c7b_578b"> &para;</a></span></h4>

<p><em class="dfn">覆盖层(overlay)</em> 用于指定应用于缓冲区某一部分的属性。每个覆盖层作用于缓冲区中一个指定的区间，并包含一个属性列表（元素为属性名与属性值交替出现的列表）。覆盖层属性用于临时以不同的显示样式展示缓冲区的部分内容。覆盖层没有可读语法，打印时以井号尖括号形式显示缓冲区名称和位置区间。
</p>
<p>有关如何创建和使用覆盖层的信息，see <a class="pxref" href="Overlays.html">覆盖层</a>。
</p>
