<h2 class="chapter" id="g_t_8bed_6cd5_8868"><span>36 语法表<a class="copiable-link" href="#g_t_8bed_6cd5_8868"> &para;</a></span></h2>
<a class="index-entry-id" id="index-parsing-buffer-text"></a>
<a class="index-entry-id" id="index-syntax-table"></a>
<a class="index-entry-id" id="index-text-parsing"></a>

<p><em class="dfn">语法表(syntax table)</em>用于指定缓冲区中每个字符的语法角色。
它可以用来判断单词、符号以及其他语法结构的起始与结束位置。
许多 Emacs 功能都会使用这一信息，包括字体锁定模式（see <a class="pxref" href="Font-Lock-Mode.html">Font Lock Mode</a>）
以及各种复杂的移动命令（see <a class="pxref" href="Motion.html">移动</a>）。
</p>
