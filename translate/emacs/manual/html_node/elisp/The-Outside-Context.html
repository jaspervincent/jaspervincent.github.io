<h4 class="subsection" id="g_t_5916_90e8_73af_5883"><span>19.2.14 外部环境<a class="copiable-link" href="#g_t_5916_90e8_73af_5883"> &para;</a></span></h4>

<p>Edebug 尽量对被调试程序保持透明，但无法完全做到。
当你使用 <kbd class="kbd">e</kbd> 或求值列表缓冲区求值表达式时，Edebug 也会通过临时恢复外部环境来保持透明。
本节精确说明 Edebug 恢复哪些环境，以及在哪些方面无法做到完全透明。
</p>
