<h4 class="subsection" id="g_t_7c7b_578b_63cf_8ff0_7b26"><span>2.4.18 类型描述符<a class="copiable-link" href="#g_t_7c7b_578b_63cf_8ff0_7b26"> &para;</a></span></h4>

<p><em class="dfn">type descriptor类型描述符</em> 是一种用于存放类型相关信息的记录。该记录的第一个槽位必须是表示该类型名称的符号，<code class="code">type-of</code> 正是依靠这一点来返回 <code class="code">record</code> 对象的类型。Emacs 本身不会使用类型描述符的其他槽位，这些槽位可自由用于 Lisp 扩展。
</p>
<p><code class="code">cl-structure-class</code> 的任意实例都是类型描述符的一个例子。
</p>
