<h4 class="subsection" id="XPM-_56fe_50cf"><span>42.17.4 XPM 图像<a class="copiable-link" href="#XPM-_56fe_50cf"> &para;</a></span></h4>
<a class="index-entry-id" id="index-XPM"></a>

<p>要使用 XPM 格式，需指定 <code class="code">xpm</code> 作为图像类型。<code class="code">xpm</code> 图像类型还支持附加图像属性 <code class="code">:color-symbols</code>：
</p>
<dl class="table">
<dt><code class="code">:color-symbols <var class="var">symbols</var></code></dt>
<dd><p>取值 <var class="var">symbols</var> 应为关联列表，元素格式为 <code class="code">(<var class="var">name</var> . <var class="var">color</var>)</code>。其中 <var class="var">name</var> 是图像文件中出现的颜色名称，<var class="var">color</var> 指定显示该名称时实际使用的颜色。
</p></dd>
</dl>
