<h3 class="appendixsec" id="Add_002don-Packages-1"><span>A.2 Add-on Packages<a class="copiable-link" href="#Add_002don-Packages-1"> &para;</a></span></h3>

<a class="index-entry-id" id="index-add_002don-packages"></a>

<p>多位开发者为 Org 编写了大量扩展包。其中部分包曾属于 &lsquo;<samp class="samp">org-mode</samp>&rsquo; 代码仓库，现在托管在独立的 &lsquo;<samp class="samp">org-contrib</samp>&rsquo; 仓库 <a class="uref" href="https://git.sr.ht/~bzg/org-contrib">此处</a>。包含更多信息的 Worg 页面地址为：<a class="uref" href="https://orgmode.org/worg/org-contrib/">https://orgmode.org/worg/org-contrib/</a>。
</p>
