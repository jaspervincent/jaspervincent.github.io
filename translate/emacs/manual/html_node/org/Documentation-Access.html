<p>在 Org 文件中按下 <kbd class="kbd">C-c C-x I</kbd>，会根据光标处语法打开 Org 手册对应章节。例如在标题上使用该按键，会显示 &ldquo;文档结构(Document Structure)&rdquo; 章节。
</p>
<p>按下 <kbd class="kbd">q</kbd> 关闭 Info 框架。
