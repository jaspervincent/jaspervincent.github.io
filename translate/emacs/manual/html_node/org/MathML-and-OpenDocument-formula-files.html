<h4 class="subsubsection" id="MathML-and-OpenDocument-formula-files-1"><span>13.12.9.2 MathML and OpenDocument formula files<a class="copiable-link" href="#MathML-and-OpenDocument-formula-files-1"> &para;</a></span></h4>

<p>若直接在 ODT 文档中嵌入 LaTeX 数学公式不稳定，可尝试另一种方式：
通过链接引入公式对应的 MathML（ &lsquo;<samp class="samp">.mml</samp>&rsquo; ）源码或开放文档公式（ &lsquo;<samp class="samp">.odf</samp>&rsquo; ）文件，示例如下：
</p>
<div class="example">
<pre class="example-preformatted">[[./equation.mml]]
</pre></div>

<p>或
</p>
<div class="example">
<pre class="example-preformatted">[[./equation.odf]]
</pre></div>

</div>
