<h4 class="subsection" id="Pre_002drequisites-for-ODT-export-1"><span>13.12.1 Pre-requisites for ODT export<a class="copiable-link" href="#Pre_002drequisites-for-ODT-export-1"> &para;</a></span></h4>

<a class="index-entry-id" id="index-zip"></a>

<p>The ODT export backend relies on the zip program to create the final
compressed ODT output.  Check if &lsquo;<samp class="samp">zip</samp>&rsquo; is locally available and
executable.  Without it, export cannot finish.
</p>
