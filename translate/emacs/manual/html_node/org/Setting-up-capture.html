<h4 class="subsection" id="Setting-up-capture-1"><span>10.1.1 Setting up capture<a class="copiable-link" href="#Setting-up-capture-1"> &para;</a></span></h4>

<p>以下自定义设置用于指定笔记的默认目标文件。
</p>
<a class="index-entry-id" id="index-org_002ddefault_002dnotes_002dfile"></a>
<div class="example lisp">
<pre class="lisp-preformatted">(setq org-default-notes-file (concat org-directory &quot;/notes.org&quot;))
</pre></div>

<p>你也可以为捕获新内容定义全局快捷键（参见 <a class="ref" href="Activation.html">Activation</a>）。
</p>
</div>
